[project]
name = "quanteasy-backend"
version = "0.1.0"
description = "FastAPI backend for QuantEasy commercial workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14.1,<2.0.0",
  "email-validator>=2.2.0,<3.0.0",
  "fastapi>=0.115.12,<1.0.0",
  "httpx>=0.28.1,<1.0.0",
  "psycopg[binary]>=3.2.6,<4.0.0",
  "pydantic-settings>=2.8.1,<3.0.0",
  "python-json-logger>=3.3.0,<4.0.0",
  "sqlalchemy>=2.0.39,<3.0.0",
  "uvicorn[standard]>=0.34.0,<1.0.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: FastAPI's Depends()/Header() in argument defaults is the framework's documented idiom.
# UP042: the str+Enum models are persisted by value; StrEnum would be a no-op churn.
ignore = ["B008", "UP042"]

[tool.pytest.ini_options]
pythonpath = ["."]
